name: Synthetic demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.lock
      - name: Generate synthetic demo data
        run: python -m quakeexplorer build --input fixtures/synthetic_usgs.geojson --out-dir web/demo-data --dataset-kind synthetic
        env:
          PYTHONPATH: src
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Verify distributable data
        run: python scripts/verify_bundle.py web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
