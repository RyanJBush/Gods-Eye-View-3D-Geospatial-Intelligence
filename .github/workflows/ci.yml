# CI runs on synthetic fixtures only. The real USGS snapshot and anything derived from it are
# never in the repository, never an artifact, and never in a bundle built here.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tracked-file guard (no real or derived data tracked)
        run: python scripts/check_tracked_files.py

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Python tests (synthetic fixtures)
        run: python -m pytest -q
        env:
          PYTHONPATH: src
      - name: Synthetic fixture file is up to date
        run: |
          python scripts/make_fixtures.py
          git diff --exit-code -- fixtures/synthetic_usgs.geojson
      - name: Build synthetic artifacts twice and compare bytes
        run: |
          python -m quakeexplorer build --input fixtures/synthetic_usgs.geojson --out-dir "$RUNNER_TEMP/a" --dataset-kind synthetic
          python -m quakeexplorer build --input fixtures/synthetic_usgs.geojson --out-dir "$RUNNER_TEMP/b" --dataset-kind synthetic
          cmp "$RUNNER_TEMP/a/events.json" "$RUNNER_TEMP/b/events.json"
          cmp "$RUNNER_TEMP/a/analysis.json" "$RUNNER_TEMP/b/analysis.json"
        env:
          PYTHONPATH: src

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Generate synthetic demo data (the only data a bundle may contain)
        run: python -m quakeexplorer build --input fixtures/synthetic_usgs.geojson --out-dir web/demo-data --dataset-kind synthetic
        env:
          PYTHONPATH: src
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck, build
        run: npm run build
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: Bundle is allowlisted files plus synthetic demo data only
        run: python scripts/verify_bundle.py web/dist
